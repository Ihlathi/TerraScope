name: Build

# Temporary trimmed workflow on build/v0.1-desktop: one Windows x64 installer and
# one unsigned macOS arm64 DMG for trying TerraScope v0.1. Not for main.

on:
  push:
    branches:
      - "build/v0.1-desktop"
  workflow_dispatch:

jobs:
  compile-frc6328:
    name: Compile bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.12
      - name: Install Node.js dependencies
        run: npm ci
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile WebAssembly
        run: npm run wasm:compile
      - name: Compile bundles
        run: npm run compile
      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles
          retention-days: 3
          path: |
            bundles/**/*.js
            bundles/**/*.wasm

  build-win:
    name: Build for Windows (x64, unsigned)
    needs: compile-frc6328
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install Node.js dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: bundles
      - name: Build documentation
        run: npm run docs:build-embed
      - name: Build app
        shell: bash
        run: npx electron-builder build --x64 --win nsis --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_7Z_FILTER: BCJ # https://github.com/electron-userland/electron-builder/issues/9983
      - name: Prepare artifact
        shell: bash
        run: |
          ls -la dist
          mv "$(ls dist/*.exe | head -n1)" terrascope-win-x64-v0.1.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          retention-days: 30
          path: terrascope-win-x64-v0.1.exe

  build-mac:
    name: Build for macOS (arm64, unsigned)
    needs: compile-frc6328
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"
      - name: Install Node.js dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          name: bundles
          path: bundles
      - name: Build documentation
        run: npm run docs:build-embed
      - name: Build app (ad-hoc signed, not notarized)
        run: npx electron-builder build --arm64 --mac dmg --publish never -c.mac.identity=- -c.mac.notarize=false
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Prepare artifact
        run: |
          ls -la dist
          mv "$(ls dist/*.dmg | head -n1)" terrascope-mac-arm64-v0.1.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          retention-days: 30
          path: terrascope-mac-arm64-v0.1.dmg
